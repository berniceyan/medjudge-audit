[project]
name = "judgeaudit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "berniceyan", email = "berniceyyan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jupyterlab>=4.6.1",
    "krippendorff>=0.8.2",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "openai>=2.45.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]
